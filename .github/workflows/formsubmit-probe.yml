# 임시 — 온라인 접수(FormSubmit) 활성화 상태 확인: 시험 접수 1건을 실제 홈페이지와 같은 출처로 보내 응답만 기록. 확인 후 삭제합니다.
name: FormSubmit probe (temporary)
on:
  push:
    branches: [claude/relaxed-tesla-b6xzts]
    paths: ['.github/workflows/formsubmit-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Send one test submission
        run: |
          curl -sS -m 30 -X POST "https://formsubmit.co/ajax/bmig777won@gmail.com" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -H "Origin: https://www.worldhopedeclaration.com" -H "Referer: https://www.worldhopedeclaration.com/" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0 Safari/537.36" \
            -d '{"_subject":"[점검] 홈페이지 온라인 접수 시험","_template":"table","_captcha":"false","점검":"홈페이지 관리 중 보낸 시험 접수입니다. 이 메일을 받으셨다면 온라인 접수가 정상입니다.","보낸 곳":"GitHub Actions 점검"}' -w '\nHTTP %{http_code}\n'
