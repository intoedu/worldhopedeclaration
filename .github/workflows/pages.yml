# GitHub Pages 배포 (GitHub 공식 시작 워크플로 actions/starter-workflows pages/static.yml 기준)
# - main 브랜치에 올라올 때마다 홈페이지 파일을 그대로 게시합니다(빌드 없음). 작업 문서·도구(docs, scripts, README, CLAUDE.md)는 제외.
# - 저장소 Settings → Pages → Build and deployment → Source 가 "GitHub Actions" 일 때 이 워크플로가 배포합니다.
# - Actions 탭에서 "Run workflow" 로 수동 배포도 할 수 있습니다.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩, 진행 중인 배포는 끝까지 마칩니다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # 홈페이지에 필요한 파일만 모음 — 작업 문서(docs, README, CLAUDE.md)와 도구(scripts)는 게시하지 않음
      # (shell: bash → 중간 명령 하나라도 실패하면 배포를 멈춤. ./docs 처럼 맨 위 폴더만 제외되고 assets 안의 같은 이름은 그대로 게시됨)
      - name: Collect site files
        shell: bash
        run: |
          mkdir -p _site
          tar -cf - \
            --exclude=./.git --exclude=./.github --exclude=./_site --exclude=./node_modules \
            --exclude=./docs --exclude=./scripts --exclude=./CLAUDE.md --exclude=./README.md \
            --exclude=./package.json --exclude=./package-lock.json \
            . | tar -xf - -C _site
          for f in index.html 404.html; do
            if [ ! -f "_site/$f" ]; then echo "::error::게시 파일에 $f 이(가) 없습니다"; exit 1; fi
          done
          for d in assets data admin; do
            if [ ! -d "_site/$d" ]; then echo "::error::게시 파일에 $d 폴더가 없습니다"; exit 1; fi
          done
          echo "게시 파일 수: $(find _site -type f | wc -l)"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
