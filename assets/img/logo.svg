<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="세계희망연대 임시 로고">
  <!-- 임시 로고: 지평선 위로 떠오르는 희망의 빛. 단체 정식 로고 수신 시 교체 -->
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1F44"/>
      <stop offset="1" stop-color="#1A4BA8"/>
    </linearGradient>
    <linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7D58C"/>
      <stop offset="1" stop-color="#E0A93B"/>
    </linearGradient>
    <clipPath id="lg-clip"><circle cx="32" cy="32" r="30"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#lg-bg)"/>
  <g clip-path="url(#lg-clip)">
    <g stroke="#F3D08A" stroke-width="2.2" stroke-linecap="round" opacity=".9">
      <line x1="32" y1="9" x2="32" y2="15"/>
      <line x1="17.5" y1="15" x2="21.2" y2="19.6"/>
      <line x1="46.5" y1="15" x2="42.8" y2="19.6"/>
      <line x1="9.5" y1="27" x2="15.2" y2="28.8"/>
      <line x1="54.5" y1="27" x2="48.8" y2="28.8"/>
    </g>
    <circle cx="32" cy="38" r="13" fill="url(#lg-sun)"/>
    <path d="M-4 40 Q32 30 68 40 L68 70 L-4 70 Z" fill="#123064"/>
    <path d="M-4 40 Q32 30 68 40" fill="none" stroke="#F7D58C" stroke-width="1.6"/>
    <path d="M6 50 Q32 43 58 50" fill="none" stroke="#3478E8" stroke-width="1.2" opacity=".8"/>
    <path d="M12 58 Q32 53 52 58" fill="none" stroke="#3478E8" stroke-width="1.2" opacity=".6"/>
  </g>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#F3D08A" stroke-opacity=".55" stroke-width="1.2"/>
</svg>
