<!doctype html>
<html lang="ko" data-lang="ko" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비전과 미션으로 이동합니다 | 세계희망연대</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="‘사역 안내’는 ‘비전과 미션’ 페이지로 옮겨졌습니다.">
<script>
  // 예전 주소(ministry.html) → vision.html 로 바로 이동 (#research 같은 바로가기와 ?lang= 유지)
  (function () {
    "use strict";
    try {
      location.replace("vision.html" + location.search + location.hash);
    } catch (e) { /* 실패하면 아래 meta refresh 와 링크로 이동 */ }
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=vision.html"></noscript>
<meta name="theme-color" content="#13294b">
<link rel="icon" href="assets/img/brand/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Serif:wght@700&display=swap">
<link rel="stylesheet" href="assets/css/style.css?v=20261013d">
<style>.moved-mark { width: 72px; height: 72px; margin: 0 auto 6px; }</style>
<script>(function(){try{var l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("wh-lang");if(l==="en"){var h=document.documentElement;h.setAttribute("data-lang","en");h.lang="en";}}catch(e){}})();</script>
</head>
<body data-page="ministry">
<main id="main">
  <section class="error-hero">
    <div class="container">
      <img class="moved-mark" src="assets/img/brand/logo-mark-160.png" alt="" width="72" height="72">
      <h1 class="error-title"><span class="ko">‘사역 안내’는 ‘비전과 미션’으로 옮겨졌습니다</span><span class="en">“Ministries” has moved to “Vision &amp; Mission”</span></h1>
      <p class="error-text"><span class="ko">잠시 후 자동으로 이동합니다. 이동하지 않으면 아래 버튼을 눌러 주세요.</span><span class="en">You will be redirected shortly. If not, please use the button below.</span></p>
      <div class="error-actions">
        <a class="btn btn-primary btn-lg" href="vision.html"><span class="ko">비전과 미션으로 이동</span><span class="en">Go to Vision &amp; Mission</span></a>
      </div>
    </div>
  </section>
</main>
</body>
</html>
